  <body data-effect="soft-spark">
    <!-- Upload screen -->
    <section class="upload-stage" id="uploadStage" aria-label="PDF 위에 타이핑 메모하기">
      <div class="upload-card">
        <h1>PDF 위에 귀엽게 타이핑하고<br>복습하세요</h1>
        <div style="margin:0 0 10px;color:#e9b99f;font-size:13px;font-weight:600;letter-spacing:.02em;">
          StudyTypingNote · by
          <a href="https://github.com/chaeyununu" rel="author me" style="color:inherit;text-decoration:none;">chaeyununu</a>
        </div>
        <p>PDF 위에 바로 쓰고, 키보드 소리와 반짝이는 typing effects를 즐겨보세요 ✨</p>
        <label class="upload-drop" id="uploadDrop">
          <input type="file" id="pdfInput" accept="application/pdf" hidden>
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 15v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="upload-drop-title">PDF 선택하기</span>
          <span class="upload-drop-sub">or drop your PDF here </span>
        </label>
      </div>
    </section>

    <!-- PDF stage -->
    <main class="pdf-stage" id="pdfStage" hidden>
      <div class="pdf-scroll" id="pdfScroll"></div>
    </main>

    <!-- Toolbar -->
    <header class="ink-toolbar" id="inkToolbar" hidden aria-label="Tools">
      <div class="toolbar-cluster toolbar-file">
        <button class="round-icon" id="changePdfBtn" type="button" aria-label="Open a different PDF" title="Open another PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 0v5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <span class="pdf-name" id="pdfNameLabel">document.pdf</span>
      </div>

      <div class="toolbar-cluster">
        <button class="round-icon" id="zoomOutBtn" type="button" aria-label="Zoom out">−</button>
        <span class="zoom-readout" id="zoomReadout">100%</span>
        <button class="round-icon" id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="round-icon" id="prevPageBtn" type="button" aria-label="Previous page">‹</button>
        <span class="page-readout" id="pageReadout">1 / 1</span>
        <button class="round-icon" id="nextPageBtn" type="button" aria-label="Next page">›</button>
      </div>

      <div class="toolbar-cluster">
        <button class="round-icon" id="typeToolBtn" type="button" aria-pressed="false" aria-label="Type tool (T)" title="Type tool (T)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16m-3 0h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <label class="switch-row" title="Typing sparks">
          <span>FX</span>
          <input id="effectEnabled" type="checkbox">
        </label>
        <label class="switch-row" title="Key sounds">
          <span>Sound</span>
          <input id="soundEnabled" type="checkbox">
        </label>
        <button class="round-icon" id="settingsToggleBtn" type="button" aria-label="Open settings" aria-controls="settingsPanel" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        <button class="round-icon" id="fullscreenBtn" type="button" aria-label="Toggle full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <p class="place-hint" id="placeHint" hidden>페이지 아무 곳이나 클릭해서 typing start ✍️</p>

    <div class="drawer-overlay" id="drawerOverlay" aria-hidden="true"></div>

    <!-- Settings: one mood picker + a few basics. Everything else is under "More". -->
    <aside class="settings-panel" id="settingsPanel" aria-label="Settings" inert>
      <div class="settings-header">
        <h2>Studio</h2>
        <button class="round-icon" id="closeSettingsBtn" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <section class="setting-group">
        <h3>Mood</h3>
        <p class="micro-copy">Picks the sparks, key sound and font together.</p>
        <div class="mood-grid" id="moodGrid"></div>
        <div class="try-note" id="tryNote" contenteditable="true" spellcheck="false" data-placeholder="Try typing here"></div>
      </section>

      <section class="setting-group">
        <h3>Typing</h3>
        <label class="field">
          <span>Effect strength</span>
          <input id="intensityRange" type="range" min="0" max="100" step="5">
          <output id="intensityReadout">80%</output>
        </label>
        <label class="field">
          <span>Volume</span>
          <input id="volumeRange" type="range" min="0" max="100" step="1">
          <output id="volumeReadout">38%</output>
        </label>
      </section>

      <section class="setting-group">
        <h3>Ink</h3>
        <label class="field field-select">
          <span>Font</span>
          <select id="fontSelect"></select>
        </label>
        <label class="field">
          <span>Size</span>
          <input id="fontSizeRange" type="range" min="12" max="36" step="1">
          <output id="fontSizeReadout">18 px</output>
        </label>
        <div class="field">
          <span>Color</span>
          <span class="swatch-row" id="inkColorRow">
            <button class="swatch" type="button" data-color="#2c2420" style="--c:#2c2420" aria-label="Dark ink"></button>
            <button class="swatch" type="button" data-color="#1f3a8f" style="--c:#1f3a8f" aria-label="Blue ink"></button>
            <button class="swatch" type="button" data-color="#b32b2b" style="--c:#b32b2b" aria-label="Red ink"></button>
            <button class="swatch" type="button" data-color="#1f6e4a" style="--c:#1f6e4a" aria-label="Green ink"></button>
            <button class="swatch" type="button" data-color="#6a3fb0" style="--c:#6a3fb0" aria-label="Violet ink"></button>
          </span>
        </div>
      </section>

      <details class="setting-group more">
        <summary>More</summary>
        <label class="field field-select">
          <span>Spark style</span>
          <select id="effectModeSelect"></select>
        </label>
        <label class="field field-select">
          <span>Key sound</span>
          <select id="soundPackSelect"></select>
        </label>
      </details>
    </aside>

    <div class="feedback-layer" id="inkLayer" aria-hidden="true">
      <canvas class="fx-canvas" id="fxCanvas"></canvas>
      <span class="caret-glow" id="caretGlow"></span>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
